<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Responsive Image Filter Gallery</title>
<link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
  <main>
    <h1>Image Filter Gallery</h1>
    <section class="gallery" aria-label="Image filter gallery">
      <figure><img src="https://picsum.photos/600/400?random=1" alt="blur example"><figcaption>Blur</figcaption></figure>
      <figure><img src="https://picsum.photos/600/400?random=2" alt="grayscale example"><figcaption>Grayscale</figcaption></figure>
      <figure><img src="https://picsum.photos/600/400?random=3" alt="sepia example"><figcaption>Sepia</figcaption></figure>
      <figure><img src="https://picsum.photos/600/400?random=4" alt="brightness example"><figcaption>Brightness</figcaption></figure>
      <figure><img src="https://picsum.photos/600/400?random=5" alt="contrast example"><figcaption>Contrast</figcaption></figure>
      <figure><img src="https://picsum.photos/600/400?random=6" alt="hue rotate example"><figcaption>Hue-rotate</figcaption></figure>
    </section>
  </main>
</body>
</html>
