<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filter Comparison Layout</title>
<link rel="stylesheet" href="filter_comparison_layout.css">
</head>
<body>
  <main class="compare" aria-label="before after">
    <figure>
      <img src="https://picsum.photos/700/450?random=31" alt="before"><figcaption>Before</figcaption>
    </figure>
    <figure>
      <img src="https://picsum.photos/700/450?random=32" alt="after"><figcaption>After (filtered)</figcaption>
    </figure>
  </main>
</body>
</html>
