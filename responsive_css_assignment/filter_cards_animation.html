<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filter Cards with Animation</title>
<link rel="stylesheet" href="filter_cards_animation.css">
</head>
<body>
  <main>
    <section class="profiles" aria-label="profiles">
      <article class="profile">
        <img src="https://picsum.photos/400/300?random=11" alt="Person 1">
        <div class="info"><h3>Person 1</h3><p>Designer</p></div>
      </article>
      <article class="profile">
        <img src="https://picsum.photos/400/300?random=12" alt="Person 2">
        <div class="info"><h3>Person 2</h3><p>Developer</p></div>
      </article>
      <article class="profile">
        <img src="https://picsum.photos/400/300?random=13" alt="Person 3">
        <div class="info"><h3>Person 3</h3><p>Manager</p></div>
      </article>
    </section>
  </main>
</body>
</html>
