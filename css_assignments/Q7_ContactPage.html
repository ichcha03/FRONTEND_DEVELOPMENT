<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact - Gaurav</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial;background:#eef4fb;display:flex;align-items:center;justify-content:center;height:100vh;color:#222}
    form{background:#fff;padding:1.2rem;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.08);width:320px}
    label{display:block;margin-bottom:0.25rem;font-size:0.9rem}
    input[type="text"], input[type="email"], textarea, select{width:100%;padding:0.6rem;margin-bottom:0.8rem;border:1px solid #cfcfcf;border-radius:6px}
    textarea{min-height:100px;resize:vertical}
    input:focus, textarea:focus{outline:none;border-color:#2b86ff;box-shadow:0 0 6px rgba(43,134,255,0.15)}
    button{width:100%;padding:0.6rem;background:#2b86ff;color:#fff;border:none;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <form aria-label="Contact form">
    <h2 style="text-align:center;margin-bottom:0.6rem">Contact</h2>
    <label for="name">Name</label>
    <input id="name" name="name" type="text" placeholder="Gaurav Chaudhary" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com" required>
    <label for="subject">Subject</label>
    <input id="subject" name="subject" type="text" placeholder="Subject">
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Your message"></textarea>
    <button type="submit">Send</button>
  </form>
</body>
</html>
