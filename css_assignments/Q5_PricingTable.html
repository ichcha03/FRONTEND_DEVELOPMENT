<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pricing Plans - Gaurav</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial;background:#f4f4f6;padding:2rem;color:#222}
    .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:1100px;margin:0 auto;align-items:start}
    .plan{background:#fff;padding:1.2rem;border-radius:8px;text-align:center;border:1px solid #e0e0e0;transition:transform 0.25s ease, background 0.25s ease;display:flex;flex-direction:column;justify-content:space-between;min-height:220px}
    .plan:hover{transform:translateY(-6px);background:#f0fbff}
    .popular{border:2px solid #1f8ce6;box-shadow:0 6px 18px rgba(31,140,230,0.08)}

    h2{margin-bottom:0.5rem}
    ul{list-style:none;margin:0;padding:0 0 1rem}
    li{padding:0.2rem 0;color:#444}
    .price{font-size:1.6rem;font-weight:700;margin:0.6rem 0}
    .btn{display:inline-block;padding:0.6rem 1rem;border-radius:6px;text-decoration:none;background:#1f8ce6;color:#fff}
    @media(max-width:800px){ .plans{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <h1 style="text-align:center;margin-bottom:1rem">Pricing</h1>
    <section class="plans" aria-label="Pricing plans">
      <div class="plan">
        <div>
          <h2>Basic</h2>
          <p class="price">$5/mo</p>
          <ul><li>Feature A</li><li>Feature B</li><li>Feature C</li></ul>
        </div>
        <a class="btn" href="#">Choose</a>
      </div>

      <div class="plan popular">
        <div>
          <h2>Standard</h2>
          <p class="price">$12/mo</p>
          <ul><li>Feature A</li><li>Feature B</li><li>Feature C</li><li>Popular</li></ul>
        </div>
        <a class="btn" href="#">Choose</a>
      </div>

      <div class="plan">
        <div>
          <h2>Premium</h2>
          <p class="price">$25/mo</p>
          <ul><li>Feature A</li><li>Feature B</li><li>Feature C</li><li>Priority Support</li></ul>
        </div>
        <a class="btn" href="#">Choose</a>
      </div>
    </section>
  </main>
</body>
</html>
