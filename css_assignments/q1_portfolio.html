<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Portfolio - Gaurav Chaudhary</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* Basic reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; line-height: 1.4; color:#222; background:#f7f7f7; }

    /* Header fixed at top */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #0b63a5; color: #fff;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.2rem;
      z-index: 10;
    }
    header nav a { color:#fff; text-decoration:none; margin-left:1rem; font-size:0.95rem; }
    main { padding: 6rem 1rem 3rem; max-width:1000px; margin:0 auto; }

    .hero { display:flex; gap:2rem; align-items:center; background:#fff; padding:1.2rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); }
    .bio { flex:1; }
    .bio h1 { font-size:1.8rem; margin-bottom:0.3rem; }
    .bio p { margin-bottom:0.6rem; color:#444; }

    /* Profile image using different CSS units */
    .profile { width: 10rem; height:10rem; flex:0 0 10rem; border-radius:8px; overflow:hidden; }
    .profile img { width:100%; height:100%; object-fit:cover; display:block; }

    /* Footer pinned to bottom using flex layout on body */
    footer { margin-top:2rem; text-align:center; padding:1rem 0; color:#fff; background:#0b63a5; }

    /* Responsive */
    @media (max-width:600px) {
      .hero { flex-direction:column; align-items:flex-start; }
      .profile { width:8rem; height:8rem; }
    }
  </style>
</head>
<body>
  <header>
    <div><strong>Gaurav Chaudhary</strong></div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-label="Profile">
      <div class="bio">
        <h1>Gaurav Chaudhary</h1>
        <p>Web developer student focused on front-end design and CSS fundamentals. This mini-portfolio demonstrates layout, units and accessible structure.</p>
        <p style="font-size:0.9rem;color:#666">Uses: px, em, %, vh, rem across elements.</p>
      </div>
      <div class="profile">
        <img src="https://via.placeholder.com/300x300.png?text=Gaurav" alt="Profile image of Gaurav Chaudhary">
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 Gaurav Chaudhary
  </footer>
</body>
</html>
