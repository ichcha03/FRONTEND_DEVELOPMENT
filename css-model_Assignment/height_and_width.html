<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Height and Width Practice</title>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
}
.container{
  display:flex;
  gap:20px;
}
.box{
  background-color:lightblue;
  text-align:center;
}
.box1{
  width:200px;
  height:150px;
}
.box2{
  width:50%;
  min-height:100px;
  max-width:250px;
  background-color:lightgreen;
}
.box3{
  width:20vw;
  height:20vh;
  overflow:auto;
  background-color:lightcoral;
}
</style>
</head>
<body>
<main class="container">
  <div class="box box1">px units</div>
  <div class="box box2">%, min-height, max-width</div>
  <div class="box box3">vh and vw<br>Overflow text test<br>Overflow text test<br>Overflow text test</div>
</main>
</body>
</html>
