<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borders and Padding Demonstration</title>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial, sans-serif;
}
.container{
  display:flex;
  gap:15px;
}
.box{
  width:100px;
  height:100px;
  text-align:center;
  line-height:100px;
  transition: border-color 0.3s;
}
.solid{border:3px solid blue; padding:10px;}
.dashed{border:3px dashed green; padding:15px;}
.double{border:4px double orange; padding:20px;}
.groove{border:4px groove purple; padding:25px; border-radius:10px;}
.box:hover{border-color:red;}
</style>
</head>
<body>
<main class="container">
  <div class="box solid">Solid</div>
  <div class="box dashed">Dashed</div>
  <div class="box double">Double</div>
  <div class="box groove">Groove</div>
</main>
</body>
</html>
