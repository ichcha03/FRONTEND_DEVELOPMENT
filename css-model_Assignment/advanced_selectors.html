<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced CSS Selectors</title>
<style>
body{font-family:Arial,sans-serif; padding:20px;}
input[type="text"]{border:1px solid black; padding:5px;}
a[href^="https"]{color:blue;}
li:nth-child(even){background-color:#eee;}
a:hover{color:red;}
input:focus{border-color:green;}
li::before{content:"• ";}
div > p{color:purple;}
h3 + ul{border:1px solid gray;}
</style>
</head>
<body>
<h2>Advanced CSS Selectors</h2>
<input type="text" placeholder="Focus me">
<br><br>
<a href="https://example.com">HTTPS Link</a><br>
<a href="http://example.com">HTTP Link</a>
<h3>List Example</h3>
<ul>
  <li>Item 1</li>
  <li>Item 2</li>
  <li>Item 3</li>
</ul>
<div>
  <p>Child Paragraph</p>
  <section><p>Descendant Paragraph</p></section>
</div>
</body>
</html>
