<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typography and Text Styling</title>
<style>
body{
  font-family:Arial, sans-serif;
  margin:20px;
  line-height:1.6;
}
p{
  text-align:justify;
}
mark{background:yellow;}
strong{color:blue;}
em{color:red;}
p::first-letter{
  font-size:30px;
  color:green;
}
p::first-line{
  font-weight:bold;
}
</style>
</head>
<body>
<h2>Typography Example</h2>
<p><strong>Typography</strong> is the art of arranging text. <em>Good typography</em> improves readability. <mark>This line is highlighted</mark> for emphasis and style testing.</p>
</body>
</html>
