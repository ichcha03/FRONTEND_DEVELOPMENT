<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Background</title>
<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}
header, footer{
  background:#333;
  color:white;
  text-align:center;
  padding:10px;
  position:fixed;
  width:100%;
}
header{top:0;}
footer{bottom:0;}
main{
  margin-top:50px;
  margin-bottom:40px;
}
.linear{
  height:50vh;
  background:linear-gradient(to right, red, yellow);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}
.radial{
  height:50vh;
  background:radial-gradient(circle, lightblue, darkblue);
  background-attachment:fixed;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}
</style>
</head>
<body>
<header>Fixed Header</header>
<main>
  <section class="linear">Linear Gradient Section</section>
  <section class="radial">Radial Gradient Section</section>
</main>
<footer>Fixed Footer</footer>
</body>
</html>
