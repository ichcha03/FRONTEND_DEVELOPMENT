<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Showcase</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #f9f9f9; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }
    figure {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    img {
      width: 100%;
      display: block;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    figure:hover img {
      transform: scale(1.1);
      filter: brightness(80%);
    }
    figcaption { text-align: center; padding: 8px; background: #fff; }
  </style>
</head>
<body>
  <main class="gallery">
    <figure><img src="https://via.placeholder.com/200" alt=""><figcaption>Image 1</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" alt=""><figcaption>Image 2</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" alt=""><figcaption>Image 3</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" alt=""><figcaption>Image 4</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" alt=""><figcaption>Image 5</figcaption></figure>
    <figure><img src="https://via.placeholder.com/200" alt=""><figcaption>Image 6</figcaption></figure>
  </main>
</body>
</html>
