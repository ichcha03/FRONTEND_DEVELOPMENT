<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UI Components</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial;
      background: linear-gradient(to right, #f0f8ff, #e6e6fa);
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    input, select, button {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 200px;
    }
    input:focus, select:focus, button:hover {
      border-color: royalblue;
      box-shadow: 0 0 5px lightblue;
    }
    button { background: royalblue; color: white; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <input type="text" placeholder="Search...">
    <select>
      <option>Option 1</option>
      <option>Option 2</option>
    </select>
    <button>Submit</button>
  </div>
</body>
</html>
