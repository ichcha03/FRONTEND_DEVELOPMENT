<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pseudo-Classes Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
      padding: 20px;
      flex-wrap: wrap;
    }
    a:hover { color: red; }
    button:active { background-color: lightgreen; }
    input:focus { border: 2px solid blue; }
    li:nth-child(odd) { background-color: #f2f2f2; }
    .box { padding: 10px; border: 1px solid #ccc; width: 200px; text-align: center; }
  </style>
</head>
<body>
  <section class="box">
    <p><b>:hover</b> changes color when hovered</p>
    <a href="#">Hover me</a>
  </section>
  <section class="box">
    <p><b>:focus</b> highlights focused input</p>
    <input type="text" placeholder="Click here">
  </section>
  <section class="box">
    <p><b>:active</b> changes button color on click</p>
    <button>Click me</button>
  </section>
  <section class="box">
    <p><b>:nth-child()</b> styles alternate list items</p>
    <ul>
      <li>Item 1</li><li>Item 2</li><li>Item 3</li><li>Item 4</li>
    </ul>
  </section>
</body>
</html>
