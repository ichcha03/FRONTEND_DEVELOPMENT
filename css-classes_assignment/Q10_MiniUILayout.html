<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini UI Layout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header, footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px 0;
    }
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    input, button {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      width: 200px;
    }
    button {
      background: royalblue;
      color: white;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: deepskyblue; }
    input:focus { border-color: royalblue; }
    img { width: 100px; border-radius: 5px; }
  </style>
</head>
<body>
  <header><h1>Mini UI Layout</h1></header>
  <main>
    <div class="card">
      <img src="https://via.placeholder.com/100" alt="Sample">
      <input type="text" placeholder="Enter Name">
      <button>Submit</button>
    </div>
  </main>
  <footer><p>Footer Section</p></footer>
</body>
</html>
